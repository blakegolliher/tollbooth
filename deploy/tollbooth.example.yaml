# tollbooth example configuration. Every key is set to its default except the required ones,
# which carry example values. docs/CONFIG.md documents each key. Unknown keys are errors.
# Only an explicit save in `tollbooth tui` ever writes this file (ADR-0006); edit it by hand or
# there, then run `tollbooth config reload`.

node_id: tb-a01                     # required; stable across restarts
base_domains: []                    # virtual-hosted-style base domains, e.g. [s3.lab.example.com]

listen:
  address: ":8443"
  tls:
    cert: ""                        # both empty = plaintext
    key: ""
    min_version: "1.2"
  proxy_protocol: false
  trusted_proxies: []               # CIDRs whose X-Forwarded-For is honored
  read_header_timeout: 10s
  idle_timeout: 120s
  max_header_bytes: 1048576
  max_inflight: 4096                # with copy_buffer_bytes bounds copy memory at 512 MiB

backend:
  scheme: http                      # required: http | https
  endpoints:                        # required: host:port, round-robin
    - 127.0.0.1:9000
  tls:
    ca_bundle: ""
    insecure_skip_verify: false     # lab only
  dial_timeout: 2s
  response_header_timeout: 300s
  idle_body_timeout: 60s
  max_idle_conns_per_host: 1024
  health_check:
    interval: 5s
    timeout: 2s

proxy:
  copy_buffer_bytes: 131072
  drain_timeout: 30s

cluster:
  node_count: 1                     # each node enforces rate / node_count

limits: []                          # the rules; check-config reads each one back as a sentence
  # - name: list-storm              # "too many ListObjectsV2 calls: limit them to 20 a second"
  #   operation: ListObjectsV2      # S3 API operation names; a list, or a family like Get*; omit for every operation
  #   limit_per_second: 20          # or limit_per_minute, or limit_per_hour, or blocked: true
  #   per: source_ip                # who gets their own budget: total, access_key, bucket, prefix, or source_ip
  # - name: tenant-a-uploads
  #   operation: [PutObject, UploadPart, CompleteMultipartUpload]
  #   access_key: [AKIAEXAMPLE1, AKIAEXAMPLE2]
  #   bucket: [training-data, checkpoints]
  #   prefix: [ckpt/, logs/]
  #   source_ip: 10.20.0.0/16
  #   limit_per_second: 2000
  #   burst: 4000                   # how many may arrive at once; default is the limit's own number; 1 is strict (evenly spaced)
  #   per: [access_key, bucket]     # each access key gets its own 2,000 a second on each bucket
  #   respond: 429                  # 503 SlowDown (default, what S3 itself answers) or 429 TooManyRequests
  #   note: "why this rule exists"
  # - name: revoked-key
  #   access_key: AKIAREVOKED
  #   blocked: true                 # refuse every matching request

limiter:
  max_keys: 2000000
  sweep_interval: 10s

showback:
  dir: /var/lib/tollbooth/showback  # required; persistent path
  flush_interval: 60s
  retention_days: 400
  dimensions: [access_key, bucket, prefix, operation, status_class]
  max_tuples_per_hour: 250000
  prefixes: {}                      # e.g. {checkpoints: [ckpt/, logs/]}

admin:
  address: 127.0.0.1:9900
  token_file: ""                    # preferred: file holding the bearer token for /admin/*
  token: ""                         # inline alternative for labs; redacted in config show
  pprof: false

logging:
  level: info
  access: false
  throttle_sample: 100

features: {}

kill_switches:
  limiter_disable: false
  showback_disable: false
