node_id: tb-a01
base_domains: [s3.lab.example.com]
backend:
  scheme: https
  endpoints: [s3.lab.example.com:443, 10.0.0.2:443]
  tls:
    insecure_skip_verify: true
listen:
  trusted_proxies: [10.20.0.0/16, 192.0.2.1, fd00::/8]
limits:
  - name: tenant-a-uploads
    operation: [PutObject, UploadPart, CompleteMultipartUpload]
    access_key: [AKIAEXAMPLE1, AKIAEXAMPLE2]
    bucket: [training-data, checkpoints]
    prefix: [ckpt/, logs/]
    source_ip: 10.20.0.0/16
    limit_per_second: 2000
    burst: 4000
    per: [access_key, bucket]
  - name: list-storm
    operation: listobjectsv2          # any letter case; shown and stored in S3's spelling
    limit_per_second: 20
    per: source_ip
    respond: 429
  - name: revoked-key
    access_key: AKIAREVOKED
    blocked: true
    note: "INC-1234, key leaked 2026-11-09"
  - name: slow-prefix
    operation: [GetObject, HeadObject]
    prefix: cold/
    limit_per_second: 0.5
    per: prefix
  - name: all-listings
    operation: List*
    limit_per_minute: 600
    per: total
  - name: hourly-quota
    access_key: 1234567890           # an access key of digits stays a string
    bucket: "no"
    limit_per_hour: 20
    per: access_key
showback:
  dir: /var/lib/tollbooth/showback
  dimensions: [access_key, bucket, prefix, source_ip, operation, status_class]
  retention_days: 0
  prefixes:
    checkpoints: [ckpt/, logs/]
