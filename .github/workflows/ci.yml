name: ci

# Every PR: lint, unit with race, 60 s fuzz, govulncheck, go-licenses, CodeQL, Semgrep, and the
# integration suite against Garage and versitygw (docs/SPEC.md, Engineering quality bar). Jobs whose
# inputs do not exist yet (no Go code before Phase 1) succeed on an empty tree so the skeleton
# is green from Phase 0; each one gains teeth in the phase that adds its inputs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # CodeQL and Semgrep SARIF upload

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build, lint, test, race
        run: make all
      - name: go mod tidy is clean
        run: make tidy
      - name: fuzz 60s per target
        run: make fuzz FUZZ_TIME=60s
      - name: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-logs
          path: run/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: make vuln
      - name: go-licenses (deny GPL, LGPL, AGPL, SSPL) and notices
        run: make licenses
      - name: notices are committed
        run: git diff --exit-code THIRD_PARTY_NOTICES.md

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/analyze@v4

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/golang --config p/secrets --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  release:
    # The release artifacts and the container image build on every PR, so a broken Dockerfile or
    # unit file is caught before a tag. Nothing is published from CI; tags are cut by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: release artifacts
        run: make release
      - name: systemd unit verifies
        # The unit names /usr/local/bin/tollbooth; verify it against the binary just built so a
        # typo in a directive or a missing executable fails the job instead of being swallowed.
        run: |
          make build
          mkdir -p run/unit
          sed "s#/usr/local/bin/tollbooth#$PWD/bin/tollbooth#g" deploy/tollbooth.service > run/unit/tollbooth.service
          systemd-analyze verify --man=no run/unit/tollbooth.service
      - name: container image
        run: make image
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  integration:
    # Backends are pinned static binaries (Garage, versitygw) fetched and verified by
    # test/integration/backends.sh; no container runtime. MinIO is not used (D-022). Phase 1 adds the
    # byte-equivalence and compatibility runs behind `make compat`; until then the job only proves
    # the backends fetch and start.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: cache the pinned backends and client tools
        uses: actions/cache@v6
        with:
          path: |
            test/integration/bin
            test/integration/.venv
          key: integration-tools-${{ hashFiles('test/integration/backends.sh', 'test/integration/clients.sh') }}
      - name: byte-equivalence (s3diff) and client matrix against Garage and versitygw
        run: make compat
      - name: compat logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-logs
          path: |
            run/compat/
            docs/COMPAT.md
            docs/THROTTLE.md
          if-no-files-found: ignore
      - name: stop the backends
        if: always()
        run: test/integration/backends.sh down
      - name: backend logs
        if: failure()
        run: tail -50 test/integration/data/*.log || true
      - name: compat results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat
          path: |
            docs/COMPAT.md
            docs/THROTTLE.md
            run/
          if-no-files-found: ignore
