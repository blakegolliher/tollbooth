name: nightly

# Nightly adds the one-hour fuzz and the regression benchmarks with the ±10% threshold against the
# committed baseline (docs/SPEC.md, Test plan categories 4 and 10). Fixed runner label so
# benchmark numbers are comparable night to night.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-1h:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz 1 CPU-hour total, split evenly across targets
        run: |
          n=$(go list ./... | xargs -n1 go test -list '^Fuzz' 2>/dev/null | grep -c '^Fuzz' || true)
          if [ "$n" = "0" ]; then echo "no fuzz targets yet"; exit 0; fi
          make fuzz FUZZ_TIME=$((3600 / n))s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-logs
          path: run/
          if-no-files-found: ignore

  bench-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: benchmarks, compared against the committed baseline when one exists
        run: |
          if [ ! -f test/bench/baseline.txt ]; then
            echo "no baseline yet: running the benchmarks so this run's new.txt can be committed as test/bench/baseline.txt (Gate 2)"
            make bench
            exit 0
          fi
          make bench-compare
      - name: gated limiter measurements (1,000,000 keys; 60 s unique-key flood)
        if: always()   # a failed comparison above must not hide these (the nightly of 2026-11-10 skipped them)
        run: TOLLBOOTH_BIG=1 go test -count=1 -run 'TestDecisionLatencyAtOneMillionKeys|TestUniqueKeyFlood' -v ./internal/limiter/ 2>&1 | tee test/bench/big.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            test/bench/new.txt
            test/bench/big.txt
          if-no-files-found: ignore
